name: Update PoE2 Filters

on:
  push:
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      league:
        description: 'Exact league name; leave empty to use config.json'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: poe2-filters-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test rules and safety checks
        run: node --test

      - name: Validate offline generation for source changes
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch))
        run: node src/update.mjs --offline

      - name: Build with completed official exchange history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        env:
          POE_LEAGUE: ${{ inputs.league }}
        run: node src/update.mjs

      - name: Upload verified online filters
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: poe2-personal-filters
          path: dist/
          if-no-files-found: error
          retention-days: 7
